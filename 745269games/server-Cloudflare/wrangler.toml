# server/wrangler.toml
name = "game-server"
main = "src/index.js"
compatibility_date = "2024-03-20"

# 🌟 绑定你的 D1 数据库
[[d1_databases]]
binding = "DB"             # 你在代码里将通过 env.DB 来调用数据库
database_name = "games"    # 替换为你实际的 D1 数据库名称
database_id = "59e2501f-bae7-4f8f-9b6f-c67bd88da507" # 替换为你在 Cloudflare 控制台看到的真实 ID
