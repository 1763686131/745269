<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- 紫蓝对角渐变色 -->
    <linearGradient id="gamepadGradient" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#9C10D0" />
      <stop offset="40%" stop-color="#6B22BA" />
      <stop offset="70%" stop-color="#3A38AB" />
      <stop offset="100%" stop-color="#0A4499" />
    </linearGradient>
  </defs>

  <!-- 手柄几何多边形主体 -->
  <polygon points="
    14.25,8.62
    6.0,12.66
    1.31,34.31
    5.16,39.38
    8.72,39.38
    15.38,31.03
    32.62,31.03
    39.28,39.38
    42.84,39.38
    46.69,34.5
    41.91,12.56
    33.47,8.62
    31.5,10.03
    16.69,10.03"
    fill="url(#gamepadGradient)" />

  <!-- 十字键 -->
  <path d="
    M 10.69,14.53
    H 13.22
    V 17.06
    H 15.75
    V 19.50
    H 13.22
    V 22.03
    H 10.69
    V 19.50
    H 8.16
    V 17.06
    H 10.69
    Z"
    fill="#FFFFFF" />

  <!-- 右侧 4 个圆形按键 -->
  <circle cx="36" cy="15.28" r="1.4" fill="#FFFFFF" />
  <circle cx="33" cy="18.28" r="1.4" fill="#FFFFFF" />
  <circle cx="39" cy="18.28" r="1.4" fill="#FFFFFF" />
  <circle cx="36" cy="21.28" r="1.4" fill="#FFFFFF" />

  <!-- 左右双摇杆圆环 -->
  <circle cx="18.28" cy="25.31" r="2.72" fill="none" stroke="#FFFFFF" stroke-width="1.03" />
  <circle cx="29.72" cy="25.31" r="2.72" fill="none" stroke="#FFFFFF" stroke-width="1.03" />
</svg>
